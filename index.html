<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรม 1.3 ตอบปัญหาแนวคิดเชิงคำนวณ</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            user-select: none; /* ป้องกันการก๊อปปี้ */
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .notice { text-align: center; color: #ef4444; font-weight: bold; margin-bottom: 30px; }

        /* ส่วนกรอกข้อมูลนักเรียน (Grid Layout) */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr; 
            gap: 15px;
            background: #f1f5f9;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .info-grid-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .info-grid, .info-grid-row-2 { grid-template-columns: 1fr; }
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; font-size: 0.9em; }
        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* ส่วนข้อสอบ */
        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .q-text { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; display: block; }
        textarea {
            width: 100%; height: 100px; padding: 15px; border-radius: 8px;
            border: 1px solid var(--border); resize: vertical; font-size: 1em; box-sizing: border-box;
        }

        .status-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; font-size: 0.85em; color: #64748b;
        }
        .progress-container { width: 100%; background: #e2e8f0; height: 6px; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: 0.4s; }

        .btn-submit {
            width: 100%; padding: 18px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .btn-submit:hover { background: #1d4ed8; transform: translateY(-2px); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        #result {
            display: none; text-align: center; margin-top: 30px; padding: 30px;
            background: #ecfdf5; border-radius: 12px; border: 2px solid #10b981;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 กิจกรรม 1.3 ตอบปัญหาแนวคิดเชิงคำนวณ</h1>
    <p class="notice">⚠️ บังคับพิมพ์ตอบเท่านั้น (ห้ามวางข้อความ) • ข้อละ 3 คะแนน</p>

    <div class="info-grid">
        <div class="form-group">
            <label>เลขประจำตัวนักเรียน</label>
            <input type="text" id="studentId" placeholder="เช่น 12345">
        </div>
        <div class="form-group">
            <label>คำนำหน้าชื่อ</label>
            <select id="prefix">
                <option value="นาย">นาย</option>
                <option value="นางสาว">นางสาว</option>
            </select>
        </div>
        <div class="form-group">
            <label>ชื่อ - นามสกุล</label>
            <input type="text" id="fullName" placeholder="ไม่ต้องระบุคำนำหน้า">
        </div>
    </div>
    <div class="info-grid-row-2" style="max-width: 400px; margin: 15px auto 30px auto;">
        <div class="form-group">
            <label>เลขที่</label>
            <input type="number" id="studentNo" placeholder="เช่น 1">
        </div>
        <div class="form-group">
            <label>ห้อง (4/X)</label>
            <input type="text" id="studentClass" placeholder="เช่น 4/1">
        </div>
    </div>

    <div id="quiz-area">
        <script>
            const questions = [
                "จงอธิบายความหมายและประโยชน์ของ 'แนวคิดการแยกย่อย' (Decomposition) ในการแก้ปัญหา",
                "จงยกตัวอย่างการใช้ 'แนวคิดการจดจำรูปแบบ' (Pattern Recognition) ในชีวิตประจำวัน",
                "ทำไม 'แนวคิดเชิงนามธรรม' (Abstraction) ถึงสำคัญในการสร้างแบบจำลองหรือแผนผัง",
                "ลักษณะของ 'อัลกอริทึม' (Algorithm) ที่ดีควรเป็นอย่างไร และทำไมต้องชัดเจน",
                "แนวคิดเชิงคำนวณสามารถนำไปใช้แก้ปัญหาที่ไม่เกี่ยวกับคอมพิวเตอร์ได้อย่างไร จงยกตัวอย่าง"
            ];

            questions.forEach((q, i) => {
                document.write(`
                    <div class="question-card">
                        <span class="q-text">ข้อที่ ${i+1}: ${q}</span>
                        <textarea id="ans-${i+1}" placeholder="พิมพ์คำตอบที่นี่..." oninput="checkLiveProgress(${i+1})"></textarea>
                        <div class="status-row">
                            <span>ความถูกต้อง: <span id="perc-${i+1}">0</span>%</span>
                            <span>คะแนน: <span id="score-${i+1}">0.0</span> / 3</span>
                        </div>
                        <div class="progress-container"><div id="bar-${i+1}" class="progress-bar"></div></div>
                    </div>
                `);
            });
        </script>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submit()">ส่งคำตอบและบันทึกข้อมูล</button>

    <div id="result">
        <h2 style="color: #065f46;">✅ ส่งข้อมูลเรียบร้อยแล้ว</h2>
        <p style="font-size: 1.4em;">คะแนนรวมของคุณคือ: <span id="totalScore">0</span> / 15</p>
        <p id="saveMsg">กำลังบันทึกข้อมูลลง Google Sheets...</p>
    </div>
</div>

<script>
    const keywords = [
        ["ย่อย", "เล็ก", "แบ่ง", "ง่าย", "ประกอบ", "ส่วน"],
        ["รูปแบบ", "ซ้ำ", "คล้าย", "เคยเจอ", "ลักษณะ", "เปรียบเทียบ"],
        ["สำคัญ", "ตัดออก", "จำเป็น", "แก่น", "แบบจำลอง", "รายละเอียด"],
        ["ขั้นตอน", "ลำดับ", "ชัดเจน", "ทีละขั้น", "แม่นยำ", "ระบบ"],
        ["ประยุกต์", "แก้ปัญหา", "ชีวิต", "ระบบ", "ตรรกะ", "ขั้นตอน"]
    ];

    // ป้องกันการ Paste
    document.querySelectorAll('textarea').forEach(el => {
        el.addEventListener('paste', e => {
            e.preventDefault();
            alert("❌ ห้ามวางข้อความ! กรุณาพิมพ์ด้วยตัวเองเท่านั้น");
        });
    });

    // ฟังก์ชันตรวจสอบเรียลไทม์ (แก้ไขเรื่องคำสงวนระบบแล้ว)
    function checkLiveProgress(idx) {
        const text = document.getElementById(`ans-${idx}`).value.trim();
        if(!text) { updateUI(idx, 0, 0); return; }

        let matches = 0;
        keywords[idx-1].forEach(kw => { if(text.includes(kw)) matches++; });

        let kwPerc = (matches / keywords[idx-1].length) * 70; // คีย์เวิร์ดให้ 70%
        let lenPerc = Math.min((text.length / 60) * 30, 30);  // ความยาวให้ 30%
        let totalPerc = Math.round(kwPerc + lenPerc);
        if(totalPerc > 100) totalPerc = 100;

        let score = ((totalPerc / 100) * 3).toFixed(1);
        updateUI(idx, totalPerc, score);
    }

    function updateUI(idx, p, s) {
        document.getElementById(`perc-${idx}`).innerText = p;
        document.getElementById(`score-${idx}`).innerText = s;
        document.getElementById(`bar-${idx}`).style.width = p + "%";
        
        const bar = document.getElementById(`bar-${idx}`);
        if(p < 40) bar.style.background = "#f87171";
        else if(p < 75) bar.style.background = "#fbbf24";
        else bar.style.background = "#10b981";
    }

    async function submit() {
        const payload = {
            studentId: document.getElementById('studentId').value,
            prefix: document.getElementById('prefix').value,
            fullName: document.getElementById('fullName').value,
            studentNo: document.getElementById('studentNo').value,
            studentClass: document.getElementById('studentClass').value,
            totalScore: 0
        };

        if(!payload.studentId || !payload.fullName || !payload.studentNo || !payload.studentClass) {
            alert("⚠️ กรุณากรอกข้อมูลส่วนตัวให้ครบทุกช่อง"); return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "กำลังส่ง...";

        let finalTotal = 0;
        for(let i=1; i<=5; i++) {
            payload[`ans${i}`] = document.getElementById(`ans-${i}`).value;
            payload[`percent${i}`] = document.getElementById(`perc-${i}`).innerText;
            payload[`score${i}`] = document.getElementById(`score-${i}`).innerText;
            finalTotal += parseFloat(payload[`score${i}`]);
        }
        payload.totalScore = finalTotal.toFixed(1);

        document.getElementById('totalScore').innerText = payload.totalScore;
        document.getElementById('result').style.display = "block";
        document.getElementById('result').scrollIntoView({behavior: 'smooth'});

        // แทนที่ด้วย URL ใหม่ล่าสุดของคุณเรียบร้อยแล้ว
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiEUA6PO5-eoBsH_DoUizm0nnguo2SWVsFNcdxjYWDPtAqFzgvKxPFdDKu-LHP9tOt3g/exec";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });
            document.getElementById('saveMsg').innerText = "📊 บันทึกข้อมูลลง Google Sheets สำเร็จ!";
        } catch (e) {
            document.getElementById('saveMsg').innerText = "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";
        }
    }
</script>

</body>
</html>
