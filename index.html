<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรม 1.3 ตอบปัญหาแนวคิดเชิงคำนวณ</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 30px 15px;
            line-height: 1.6;
            user-select: none; /* ป้องกันการคัดลอกโจทย์ */
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            font-size: 1.8em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .notice {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 35px;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--danger);
        }

        /* ส่วนกรอกข้อมูลนักเรียน (Responsive Grid Layout) */
        .student-info-section {
            background: #f1f5f9;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            border: 1px solid var(--border);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 2fr; 
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-grid-sub {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 50%;
        }

        @media (max-width: 650px) {
            .info-grid, .info-grid-sub {
                grid-template-columns: 1fr;
                max-width: 100%;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9em;
            color: #334155;
        }

        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95em;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* ส่วนการ์ดข้อสอบ */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: border-color 0.2s ease;
        }

        .question-card:focus-within {
            border-color: var(--primary);
        }

        .q-text {
            font-weight: 700;
            font-size: 1.05em;
            margin-bottom: 12px;
            color: var(--text-main);
            display: block;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            resize: vertical;
            font-size: 0.98em;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        /* แสดงผลคะแนนความคืบหน้าแบบเรียลไทม์ */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 0.88em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            background: #e2e8f0;
            height: 6px;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.4s ease, background-color 0.3s ease;
        }

        /* ปุ่มส่งข้อสอบ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.15em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* กล่องแสดงสรุปคะแนนหลังจากส่งเรียบร้อย */
        #result {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 30px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 2px solid var(--success);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 กิจกรรม 1.3 ตอบปัญหาแนวคิดเชิงคำนวณ (ม.4)</h1>
    <p class="notice">⚠️ • ตรวจแบบเรียลไทม์ • ห้ามคัดลอกมาวาง </p>

    <div class="student-info-section">
        <div class="info-grid">
            <div class="form-group">
                <label for="studentId">เลขประจำตัวนักเรียน</label>
                <input type="text" id="studentId" placeholder="เช่น 12345" required>
            </div>
            <div class="form-group">
                <label for="prefix">คำนำหน้าชื่อ</label>
                <select id="prefix">
                    <option value="นาย">นาย</option>
                    <option value="นางสาว">นางสาว</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fullName">ชื่อ - นามสกุล</label>
                <input type="text" id="fullName" placeholder="ไม่ต้องพิมพ์คำนำหน้าซ้ำ" required>
            </div>
        </div>
        <div class="info-grid-sub">
            <div class="form-group">
                <label for="studentNo">เลขที่/ตอน</label>
                <input type="text" id="studentNo" placeholder="เช่น 1ก" min="1" required>
            </div>
            <div class="form-group">
                <label for="studentClass">ห้องเรียน</label>
                <input type="text" id="studentClass" placeholder="เช่น 1" required>
            </div>
        </div>
    </div>

    <div id="quiz-area">
        </div>

    <button class="btn-submit" id="submitBtn" onclick="submitQuiz()">ส่งคำตอบและบันทึกข้อมูล</button>

    <div id="result">
        <h2 style="color: #166534; margin-bottom: 10px;">🎉 ส่งคำตอบเสร็จสิ้น!</h2>
        <p style="font-size: 1.4em; font-weight: bold; margin-bottom: 5px;">คะแนนประเมินรวม: <span id="totalScore" style="color: var(--success);">0</span> / 5 คะแนน</p>
        <p id="saveMsg" style="color: var(--text-muted); font-size: 0.95em;">กำลังอัปโหลดข้อมูลเข้าสู่ระบบ...</p>
    </div>
</div>

<script>
    // 1. คลังข้อสอบระดับความยากเดียวกันทั้งหมด 15 ข้อ (ครอบคลุมทั้ง 4 องค์ประกอบของแนวคิดเชิงคำนวณ)
    const quizBank = [
        {
            question: "จงอธิบายความหมายและประโยชน์ของ 'แนวคิดการแยกย่อย' (Decomposition) ในการแก้ปัญหา<br><small style='color:var(--text-muted); font-weight:normal;'>Explain the meaning and benefits of 'Decomposition' in problem-solving.</small>",
            keywords: ["ย่อย", "เล็ก", "แบ่ง", "ง่าย", "ประกอบ", "ส่วน", "decompos", "break", "sub", "divide", "small", "part"]
        },
        {
            question: "จงยกตัวอย่างการใช้ 'แนวคิดการจดจำรูปแบบ' (Pattern Recognition) ในชีวิตประจำวัน<br><small style='color:var(--text-muted); font-weight:normal;'>Provide an example of using 'Pattern Recognition' in daily life.</small>",
            keywords: ["รูปแบบ", "ซ้ำ", "คล้าย", "เคยเจอ", "ลักษณะ", "เปรียบเทียบ", "pattern", "recogni", "similar", "repeat", "trend", "match"]
        },
        {
            question: "ทำไม 'แนวคิดเชิงนามธรรม' (Abstraction) ถึงสำคัญในการสร้างแบบจำลองหรือแผนผัง<br><small style='color:var(--text-muted); font-weight:normal;'>Why is 'Abstraction' important when creating models or diagrams?</small>",
            keywords: ["สำคัญ", "ตัดออก", "จำเป็น", "แก่น", "แบบจำลอง", "รายละเอียด", "abstract", "focus", "ignore", "detail", "model", "concept", "main"]
        },
        {
            question: "ลักษณะของ 'อัลกอริทึม' (Algorithm) ที่ดีควรเป็นอย่างไร และทำไมต้องมีความชัดเจน<br><small style='color:var(--text-muted); font-weight:normal;'>What are the characteristics of a good 'Algorithm', and why must it be clear?</small>",
            keywords: ["ขั้นตอน", "ลำดับ", "ชัดเจน", "ทีละขั้น", "แม่นยำ", "ระบบ", "algorithm", "step", "sequence", "clear", "process", "order"]
        },
        {
            question: "แนวคิดเชิงคำนวณสามารถนำไปใช้แก้ปัญหาที่ไม่เกี่ยวกับคอมพิวเตอร์ได้อย่างไร จงยกตัวอย่าง<br><small style='color:var(--text-muted); font-weight:normal;'>How can computational thinking be applied to solve non-computer problems? Give an example.</small>",
            keywords: ["ประยุกต์", "แก้ปัญหา", "ชีวิต", "ระบบ", "ตรรกะ", "ขั้นตอน", "apply", "solve", "life", "real", "logic", "everyday"]
        },
        {
            question: "หากต้องการวางแผนจัดงานวันเด็กแห่งชาติของโรงเรียน จะนำ 'แนวคิดการแยกย่อย' (Decomposition) มาช่วยจัดแบ่งงานได้อย่างไรบ้าง<br><small style='color:var(--text-muted); font-weight:normal;'>How can 'Decomposition' be used to manage a school Children's Day event?</small>",
            keywords: ["แบ่งงาน", "ฝ่าย", "ซุ้ม", "อาหาร", "ย่อย", "หน้าที่", "จัดการ", "stage", "task", "event", "plan", "assign"]
        },
        {
            question: "แพทย์ใช้ 'แนวคิดการจดจำรูปแบบ' (Pattern Recognition) ในการวินิจฉัยโรคจากอาการของคนไข้ได้อย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>How do doctors use 'Pattern Recognition' to diagnose diseases from symptoms?</small>",
            keywords: ["อาการ", "ประวัติ", "วินิจฉัย", "เคยพบ", "เปรียบเทียบ", "โรค", "pattern", "symptom", "diagnos", "history", "match", "case"]
        },
        {
            question: "ในการใช้แอปพลิเคชันแผนที่นำทาง (เช่น Google Maps) ข้อมูลใดบ้างที่ถูกตัดออกไปตาม 'แนวคิดเชิงนามธรรม' (Abstraction) เพื่อไม่ให้ผู้ใช้สับสน<br><small style='color:var(--text-muted); font-weight:normal;'>What details are ignored in a navigation app using 'Abstraction' to avoid clutter?</small>",
            keywords: ["ต้นไม้", "บ้าน", "สีตึก", "ตัดออก", "ไม่จำเป็น", "ถนน", "เส้นทาง", "ignore", "detail", "traffic", "route", "map", "building"]
        },
        {
            question: "จงอธิบายว่าการเขียน 'คู่มือสูตรทำอาหาร' หรือ 'ขั้นตอนการประกอบเฟอร์นิเจอร์' เกี่ยวข้องกับ 'อัลกอริทึม' (Algorithm) อย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>How do cooking recipes or furniture assembly instructions relate to algorithms?</small>",
            keywords: ["ขั้นตอน", "คู่มือ", "ทำตาม", "ลำดับ", "ผลลัพธ์", "สำเร็จ", "step", "recipe", "instruction", "order", "follow", "guide"]
        },
        {
            question: "หากนักเรียนต้องทำโครงงานวิทยาศาสตร์ 1 เรื่อง นักเรียนจะใช้ 'แนวคิดการแยกย่อย' (Decomposition) ในการวางแผนเริ่มทำโครงงานอย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>How can you apply 'Decomposition' to plan a science project?</small>",
            keywords: ["แบ่ง", "หัวข้อ", "ทดลอง", "สืบค้น", "รายงาน", "ขั้นตอน", "เล่ม", "project", "divide", "task", "research", "experiment", "plan"]
        },
        {
            question: "เจ้าร้านค้าออนไลน์สังเกตว่า 'ช่วงเวลา 20.00 - 22.00 น. สินค้าแฟชั่นจะขายดีที่สุด' พฤติกรรมนี้แสดงถึงแนวคิดเชิงคำนวณด้านใด และนำไปใช้ประโยชน์ต่ออย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>Which computational thinking skill identifies peak shopping times, and how can it be useful?</small>",
            keywords: ["รูปแบบ", "จดจำ", "ซ้ำ", "พฤติกรรม", "สถิติ", "โปรโมชั่น", "pattern", "recogni", "time", "sale", "trend", "stock"]
        },
        {
            question: "ในการเขียนสรุปใจความสำคัญจากหนังสือเรียนวิชาประวัติศาสตร์หนา 200 หน้า ให้เหลือเพียง 2 หน้า นักเรียนต้องใช้ 'แนวคิดเชิงนามธรรม' (Abstraction) อย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>How do you use 'Abstraction' to summarize a 200-page history book into 2 pages?</small>",
            keywords: ["ใจความ", "สำคัญ", "แก่น", "ตัด", "น้ำ", "สรุป", "รายละเอียด", "abstract", "summar", "core", "main", "ignore", "detail"]
        },
        {
            question: "ทำไมการเขียนอัลกอริทึมที่มี 'ลำดับขั้นตอนผิดพลาด' (Wrong Sequence) ถึงทำให้ผลลัพธ์การทำงานของระบบเสียหายหรือทำงานไม่ได้<br><small style='color:var(--text-muted); font-weight:normal;'>Why does a wrong sequence in an algorithm cause system failure or errors?</small>",
            keywords: ["สลับ", "ผิดพลาด", "ลำดับ", "ไม่ตามขั้นตอน", "รวน", "ไม่ได้ผล", "sequence", "order", "wrong", "error", "fail", "step"]
        },
        {
            question: "การที่นักเรียนจดจำแผนผังทางหนีไฟของอาคารเรียน เพื่อใช้หลบภัยเมื่อเกิดเหตุฉุกเฉิน ถือเป็นการประยุกต์ใช้แนวคิดเชิงคำนวณด้านใด จงอธิบายเหตุผล<br><small style='color:var(--text-muted); font-weight:normal;'>Remembering a fire escape plan applies which computational thinking concept? Explain.</small>",
            keywords: ["นามธรรม", "แบบจำลอง", "เส้นทาง", "แผนผัง", "สำคัญ", "ตัดรายละเอียด", "abstract", "map", "escape", "model", "route", "sign"]
        },
        {
            question: "การพัฒนาระบบสแกนใบหน้าเพื่อปลดล็อกสมาร์ตโฟน (Face ID) มีการนำ 'แนวคิดการจดจำรูปแบบ' (Pattern Recognition) ไปใช้อย่างไร<br><small style='color:var(--text-muted); font-weight:normal;'>How is 'Pattern Recognition' utilized in smartphone facial recognition systems?</small>",
            keywords: ["ใบหน้า", "โครงสร้าง", "เปรียบเทียบ", "พิกัด", "เอกลักษณ์", "จดจำ", "face", "biomet", "pattern", "recogni", "match", "identity"]
        }
    ];

    // 2. ฟังก์ชันสุ่มและเลือกโจทย์จำนวน 5 ข้อจากคลัง 15 ข้อ
    let selectedQuiz = [];
    function generateRandomQuiz() {
        // คัดลอก Array โคลนออกมาเพื่อไม่ให้กระทบตระกร้าหลัก
        let pool = [...quizBank];
        // วนลูปสุ่มสลับตำแหน่งแบบไร้ทิศทาง (Fisher-Yates Shuffle Algorithm)
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        // ดึงข้อสอบ 5 ข้อแรกที่สุ่มกระจายตัวได้เรียบร้อยแล้ว
        selectedQuiz = pool.slice(0, 5);
    }

    // เรียกทำงานการสุ่มโจทย์ทันทีเมื่อมีการรันหรือรีเฟรชหน้าเว็บ
    generateRandomQuiz();

    // 3. เรนเดอร์การ์ดข้อสอบลงบนหน้าเพจ HTML
    const quizArea = document.getElementById('quiz-area');
    selectedQuiz.forEach((item, i) => {
        quizArea.insertAdjacentHTML('beforeend', `
            <div class="question-card">
                <span class="q-text">ข้อที่ ${i+1}: ${item.question}</span>
                <textarea id="ans-${i+1}" placeholder="พิมพ์คำตอบวิเคราะห์ของคุณที่นี่..." oninput="checkLiveProgress(${i+1})"></textarea>
                <div class="status-row">
                    <span>ความสมบูรณ์เนื้อหา: <span id="perc-${i+1}">0</span>%</span>
                </div>
                <div class="progress-container"><div id="bar-${i+1}" class="progress-bar"></div></div>
            </div>
        `);
    });

    // ระบบล็อกห้ามวางข้อความ (Anti-Paste)
    document.querySelectorAll('textarea').forEach(el => {
        el.addEventListener('paste', e => {
            e.preventDefault();
            alert("❌ ระบบล็อกการวางข้อความ! ต้องการให้ผู้เรียนพิมพ์วิเคราะห์ด้วยตัวเองเท่านั้น");
        });
    });

    // ฟังก์ชันตรวจสอบเรียลไทม์ขณะนักเรียนพิมพ์คำตอบ
    function checkLiveProgress(idx) {
        const text = document.getElementById(`ans-${idx}`).value.trim().toLowerCase();
        if(!text) { updateUI(idx, 0); return; }

        let matches = 0;
        // ตรวจคีย์เวิร์ดเฉพาะของข้อที่สุ่มได้จริงในรอบนั้นๆ
        const currentKeywords = selectedQuiz[idx-1].keywords;
        
        currentKeywords.forEach(kw => { if(text.includes(kw.toLowerCase())) matches++; });

        let maxExpectedMatches = Math.min(currentKeywords.length / 2, 4); 
        let kwPerc = (Math.min(matches, maxExpectedMatches) / maxExpectedMatches) * 70; 
        
        let lenPerc = Math.min((text.length / 60) * 30, 30);  
        let totalPerc = Math.round(kwPerc + lenPerc);
        if(totalPerc > 100) totalPerc = 100;

        updateUI(idx, totalPerc);
    }

    // อัปเดตแถบสีและเปอร์เซ็นต์ความคืบหน้า
    function updateUI(idx, p) {
        document.getElementById(`perc-${idx}`).innerText = p;
        document.getElementById(`bar-${idx}`).style.width = p + "%";
        
        const bar = document.getElementById(`bar-${idx}`);
        if(p < 40) bar.style.background = "var(--danger)";
        else if(p < 75) bar.style.background = "var(--warning)";
        else bar.style.background = "var(--success)";
    }

    // ฟังก์ชันรวบรวมข้อมูลส่งเข้าฐานข้อมูล Google Sheets
    async function submitQuiz() {
        const studentId = document.getElementById('studentId').value.trim();
        const prefix = document.getElementById('prefix').value;
        const fullName = document.getElementById('fullName').value.trim();
        const studentNo = document.getElementById('studentNo').value.trim();
        const studentClass = document.getElementById('studentClass').value.trim();

        if(!studentId || !fullName || !studentNo || !studentClass) {
            alert("⚠️ ขออภัย: กรุณากรอกข้อมูลส่วนตัวของนักเรียนให้ครบทุกช่องก่อนส่งครับ"); 
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.style.background = "#94a3b8";
        submitBtn.innerText = "กำลังนำส่งข้อมูลเข้าสู่สเปรดชีต...";

        const payload = {
            studentId: studentId,
            prefix: prefix,
            fullName: fullName,
            studentNo: studentNo,
            studentClass: studentClass,
            totalScore: 0
        };

        let finalTotal = 0;
        for(let i = 1; i <= 5; i++) {
            let percent = parseFloat(document.getElementById(`perc-${i}`).innerText);
            let scoreForEachQuestion = percent / 100; 
            
            // แนบหัวข้อโจทย์สั้นๆ ไปพร้อมกับคำตอบ เพื่อให้คุณครูดูบน Google Sheets แล้วรู้ทันทีว่าเด็กตอบโจทย์ข้อไหน
            const shortQuestionText = selectedQuiz[i-1].question.split('<br>')[0];
            payload[`ans${i}`] = `[โจทย์: ${shortQuestionText}] -> คำตอบ: ${document.getElementById(`ans-${i}`).value.trim()}`;
            payload[`percent${i}`] = percent.toString();
            payload[`score${i}`] = scoreForEachQuestion.toFixed(2); 
            finalTotal += scoreForEachQuestion;
        }
        payload.totalScore = finalTotal.toFixed(1);

        document.getElementById('totalScore').innerText = payload.totalScore;
        document.getElementById('result').style.display = "block";
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMlrJnMVTerSgFU3xqFjlTik_FGX9-yLcPCy7qsisoqBc9NhQvWI9BKiDjJQREaSei/exec";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(payload)
            });
            
            document.getElementById('saveMsg').innerText = "📊 บันทึกคะแนนคำตอบเรียบร้อยแล้ว!";
            document.getElementById('saveMsg').style.color = "var(--success)";
            
            submitBtn.disabled = false;
            submitBtn.style.background = "var(--warning)"; 
            submitBtn.innerText = "🔄 แก้ไขคำตอบและส่งใหม่อีกครั้ง";
        } catch (error) {
            console.error("Submission Error: ", error);
            document.getElementById('saveMsg').innerText = "❌ เกิดข้อผิดพลาดทางเทคนิคในการติดต่อฐานข้อมูล โปรดแจ้งครูผู้สอน";
            document.getElementById('saveMsg').style.color = "var(--danger)";
            
            submitBtn.disabled = false;
            submitBtn.style.background = "var(--primary)";
            submitBtn.innerText = "ลองส่งข้อมูลอีกครั้ง";
        }
    }
</script>
