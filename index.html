<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบแนวคิดเชิงคำนวณ ม.4</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 30px 15px;
            line-height: 1.6;
            user-select: none;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            font-size: 1.8em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .notice {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 35px;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--danger);
        }

        .student-info-section {
            background: #f1f5f9;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            border: 1px solid var(--border);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 2fr; 
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-grid-sub {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 50%;
        }

        @media (max-width: 650px) {
            .info-grid, .info-grid-sub {
                grid-template-columns: 1fr;
                max-width: 100%;
            }
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; font-size: 0.9em; color: #334155; }
        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95em;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .q-text { font-weight: 700; font-size: 1.05em; margin-bottom: 12px; display: block; }
        textarea {
            width: 100%; height: 110px; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); resize: vertical; font-size: 0.98em;
            box-sizing: border-box; font-family: inherit; outline: none;
        }

        .status-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; font-size: 0.88em; color: var(--text-muted); font-weight: 500;
        }

        .score-badge { font-weight: 700; color: var(--text-main); background: #e2e8f0; padding: 2px 8px; border-radius: 6px; }
        .progress-container { width: 100%; background: #e2e8f0; height: 6px; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.4s ease; }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 1.15em; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease; margin-top: 15px;
        }

        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        #result {
            display: none; text-align: center; margin-top: 30px; padding: 30px;
            border-radius: 12px; background: #f0fdf4; border: 2px solid var(--success);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 แบบทดสอบแนวคิดเชิงคำนวณ (ม.4)</h1>
    <p class="notice">⚠️ ระบบตรวจข้อความเรียลไทม์ • ไม่อนุญาตให้คัดลอกคำตอบมาวาง (ข้อละ 3 คะแนน)</p>

    <div class="student-info-section">
        <div class="info-grid">
            <div class="form-group">
                <label for="studentId">1. เลขประจำตัวนักเรียน</label>
                <input type="text" id="studentId" placeholder="เช่น 12345" required>
            </div>
            <div class="form-group">
                <label for="prefix">2. คำนำหน้าชื่อ</label>
                <select id="prefix">
                    <option value="นาย">นาย</option>
                    <option value="นางสาว">นางสาว</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fullName">3. ชื่อ - นามสกุล</label>
                <input type="text" id="fullName" placeholder="ไม่ต้องพิมพ์คำนำหน้าซ้ำ" required>
            </div>
        </div>
        <div class="info-grid-sub">
            <div class="form-group">
                <label for="studentNo">4. เลขที่</label>
                <input type="number" id="studentNo" placeholder="เช่น 1" min="1" required>
            </div>
            <div class="form-group">
                <label for="studentClass">5. ห้องเรียน</label>
                <input type="text" id="studentClass" placeholder="เช่น ม.4/1" required>
            </div>
        </div>
    </div>

    <div id="quiz-area">
        <script>
            const questions = [
                "จงอธิบายความหมายและประโยชน์ของ 'แนวคิดการแยกย่อย' (Decomposition) ในการแก้ปัญหา",
                "จงยกตัวอย่างการใช้ 'แนวคิดการจดจำรูปแบบ' (Pattern Recognition) ในชีวิตประจำวัน",
                "ทำไม 'แนวคิดเชิงนามธรรม' (Abstraction) ถึงสำคัญในการสร้างแบบจำลองหรือแผนผัง",
                "ลักษณะของ 'อัลกอริทึม' (Algorithm) ที่ดีควรเป็นอย่างไร และทำไมต้องมีความชัดเจน",
                "แนวคิดเชิงคำนวณสามารถนำไปใช้แก้ปัญหาที่ไม่เกี่ยวกับคอมพิวเตอร์ได้อย่างไร จงยกตัวอย่าง"
            ];

            questions.forEach((q, i) => {
                document.write(`
                    <div class="question-card">
                        <span class="q-text">ข้อที่ ${i+1}: ${q}</span>
                        <textarea id="ans-${i+1}" placeholder="พิมพ์คำตอบวิเคราะห์ของคุณที่นี่..." oninput="checkLiveProgress(${i+1})"></textarea>
                        <div class="status-row">
                            <span>ความสมบูรณ์เนื้อหา: <span id="perc-${i+1}">0</span>%</span>
                            <span>คะแนน: <span id="score-${i+1}" class="score-badge">0.0</span> / 3.0</span>
                        </div>
                        <div class="progress-container"><div id="bar-${i+1}" class="progress-bar"></div></div>
                    </div>
                `);
            });
        </script>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitQuiz()">ส่งคำตอบและบันทึกข้อมูล</button>

    <div id="result">
        <h2 style="color: #166534; margin-bottom: 10px;">🎉 ส่งคำตอบเสร็จสิ้น!</h2>
        <p style="font-size: 1.4em; font-weight: bold; margin-bottom: 5px;">คะแนนประเมินรวม: <span id="totalScore" style="color: var(--success);">0</span> / 15 คะแนน</p>
        <p id="saveMsg" style="color: var(--text-muted); font-size: 0.95em;">กำลังบันทึกข้อมูล...</p>
    </div>
</div>

<script>
    const keywords = [
        ["ย่อย", "เล็ก", "แบ่ง", "ง่าย", "ประกอบ", "ส่วน"],
        ["รูปแบบ", "ซ้ำ", "คล้าย", "เคยเจอ", "ลักษณะ", "เปรียบเทียบ"],
        ["สำคัญ", "ตัดออก", "จำเป็น", "แก่น", "แบบจำลอง", "รายละเอียด"],
        ["ขั้นตอน", "ลำดับ", "ชัดเจน", "ทีละขั้น", "แม่นยำ", "ระบบ"],
        ["ประยุกต์", "แก้ปัญหา", "ชีวิต", "ระบบ", "ตรรกะ", "ขั้นตอน"]
    ];

    document.querySelectorAll('textarea').forEach(el => {
        el.addEventListener('paste', e => {
            e.preventDefault();
            alert("❌ ระบบล็อกการวางข้อความ! คุณต้องพิมพ์ตอบด้วยตัวเองเท่านั้น");
        });
    });

    function checkLiveProgress(idx) {
        const text = document.getElementById(`ans-${idx}`).value.trim();
        if(!text) { updateUI(idx, 0, 0); return; }

        let matches = 0;
        keywords[idx-1].forEach(kw => { if(text.includes(kw)) matches++; });

        let kwPerc = (matches / keywords[idx-1].length) * 70;
        let lenPerc = Math.min((text.length / 60) * 30, 30);
        let totalPerc = Math.round(kwPerc + lenPerc);
        if(totalPerc > 100) totalPerc = 100;

        let score = ((totalPerc / 100) * 3).toFixed(1);
        updateUI(idx, totalPerc, score);
    }

    function updateUI(idx, p, s) {
        document.getElementById(`perc-${idx}`).innerText = p;
        document.getElementById(`score-${idx}`).innerText = s;
        document.getElementById(`bar-${idx}`).style.width = p + "%";
        
        const bar = document.getElementById(`bar-${idx}`);
        if(p < 40) bar.style.background = "var(--danger)";
        else if(p < 75) bar.style.background = "var(--warning)";
        else bar.style.background = "var(--success)";
    }

    async function submitQuiz() {
        const studentId = document.getElementById('studentId').value.trim();
        const prefix = document.getElementById('prefix').value;
        const fullName = document.getElementById('fullName').value.trim();
        const studentNo = document.getElementById('studentNo').value.trim();
        const studentClass = document.getElementById('studentClass').value.trim();

        if(!studentId || !fullName || !studentNo || !studentClass) {
            alert("⚠️ กรุณากรอกข้อมูลส่วนตัวให้ครบถ้วนก่อนส่งข้อสอบครับ"); 
            return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "กำลังนำส่งข้อมูล...";

        const payload = {
            studentId: studentId,
            prefix: prefix,
            fullName: fullName,
            studentNo: studentNo,
            studentClass: studentClass,
            totalScore: 0
        };

        let finalTotal = 0;
        for(let i = 1; i <= 5; i++) {
            payload[`ans${i}`] = document.getElementById(`ans-${i}`).value.trim();
            payload[`percent${i}`] = document.getElementById(`perc-${i}`).innerText;
            payload[`score${i}`] = document.getElementById(`score-${i}`).innerText;
            finalTotal += parseFloat(payload[`score${i}`]);
        }
        payload.totalScore = finalTotal.toFixed(1);

        document.getElementById('totalScore').innerText = payload.totalScore;
        document.getElementById('result').style.display = "block";
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

        // ⚠️ นำลิงก์จากข้อ 2 ที่คุณก๊อปปี้ไว้ มาวางแทนที่เครื่องหมายคำพูดด้านล่างนี้ครับ
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfuuR75yaT8OlhwwdVLr8zEjGsvS9M_v1i-he9tVeFxQOBfmlZFSVfCwwaC4b23Uhd/exec";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            document.getElementById('saveMsg').innerText = "📊 บันทึกคำตอบและคะแนนลงใน Google Sheets สำเร็จเรียบร้อย!";
            document.getElementById('saveMsg').style.color = "var(--success)";
            document.getElementById('submitBtn').innerText = "ส่งข้อสอบสำเร็จแล้ว";
        } catch (error) {
            console.error("Error: ", error);
            document.getElementById('saveMsg').innerText = "❌ เกิดข้อผิดพลาด ไม่สามารถส่งข้อมูลได้";
            document.getElementById('saveMsg').style.color = "var(--danger)";
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = "ลองส่งข้อมูลอีกครั้ง";
        }
    }
</script>

</body>
</html>
